name: Build PyPI
on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the build output under. The release flow runs this
          workflow twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  lint:
    uses: reqstool/.github/.github/workflows/python-lint.yml@ci/385-shared-python-build # SPIKE: pin to release SHA
    with:
      package-manager: poetry

  build:
    needs: lint
    uses: reqstool/.github/.github/workflows/python-build-poetry.yml@ci/385-shared-python-build # SPIKE: pin to release SHA
    with:
      coverage-source: reqstool_python_poetry_plugin
      # e2e tests need the plugin built and `poetry self add`-ed before they run.
      install-self-as-plugin: true
      ref: ${{ inputs.ref }}
      artifact-name: ${{ inputs.artifact-name || 'dist' }}

  reqstool:
    needs: build
    uses: reqstool/.github/.github/workflows/common-reqstool-verify.yml@ci/385-shared-python-build # SPIKE: pin to release SHA
    with:
      ref: ${{ inputs.ref }}
      build-artifact: ${{ inputs.artifact-name || 'dist' }}-build

  smoke:
    needs: build
    uses: reqstool/.github/.github/workflows/python-smoke.yml@ci/385-shared-python-build # SPIKE: pin to release SHA
    with:
      ref: ${{ inputs.ref }}
      dist-artifact: ${{ inputs.artifact-name || 'dist' }}
      # Installing the wheel pulls in poetry (pinned in the wheel's dependencies).
      # Poetry itself is the host of this plugin, so the smallest meaningful
      # check on Windows/macOS is: poetry runs, the plugin module imports, and
      # the unit tests pass. e2e tests need a Poetry-managed venv and stay on Linux.
      requirements: pytest==9.2.0
      command: poetry --version && python -c "import reqstool_python_poetry_plugin.plugin" && pytest tests/unit

  validate-openspec:
    uses: reqstool/.github/.github/workflows/common-validate-openspec.yml@6fc8d3e3d4c3fdf7a83cb7b7a274e4761486ca71 # 1.2.1

  # Single stable required check: survives job renames and matrix changes.
  ci:
    if: ${{ always() }}
    needs: [lint, build, reqstool, smoke, validate-openspec]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c 'import json,sys; r={k:v["result"] for k,v in json.load(sys.stdin).items()}; print(r); sys.exit(0 if all(v=="success" for v in r.values()) else 1)'
